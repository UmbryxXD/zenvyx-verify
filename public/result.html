<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verification</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05030a;color:#d9d0ef;font-family:Inter,system-ui,Arial,sans-serif;padding:20px}.card{width:100%;max-width:480px;background:#120b1f;border:1px solid #261b3d;border-radius:28px;padding:36px;box-shadow:0 20px 60px rgba(155,92,255,.12)}h1{margin:0 0 6px;color:#fff;font-size:24px;text-align:center}.sub{text-align:center;color:#9d8fc0;font-size:13px;margin-bottom:24px}ul{padding:0;list-style:none;font-size:14px;line-height:1.5}li{margin:12px 0;padding-left:26px;position:relative}li:before{content:"✦";position:absolute;left:0;color:#9b5cff}a.btn{display:block;text-align:center;background:#9b5cff;color:#fff;text-decoration:none;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:16px;border-radius:16px;margin-top:24px}a.btn:hover{background:#8247e5}.err{color:#fda4af}.ok{color:#86efac}code{background:#261b3d;padding:2px 6px;border-radius:6px;color:#c4a5ff}</style></head>
<body><div class="card"><h1 id="h"></h1><p class="sub" id="m"></p></div>
<script>var p=new URLSearchParams(location.search),ok=p.get("ok")==="1",h=document.getElementById("h"),m=document.getElementById("m");
h.textContent=ok?"✅ You're verified!":"❌ Verification failed";m.className="sub "+(ok?"ok":"err");
m.textContent=ok?"You're all set. Go back to Discord — your role will appear in a few seconds.":(p.get("error")||"Something went wrong. Please try again.");</script></body></html>
